version: "1.0.0"
title: "AutoSway External Monitor Workflow"
description: "Inspect Sway outputs and prepare a workspace on an external monitor."
instructions: |
  You are operating Sway through AutoSway.

  Always query current outputs and workspaces before acting.
  Identify the requested output from actual Sway state; never invent an output name.
  Do not disrupt unrelated workspaces.
  Prefer AutoSway capabilities over raw swaymsg.
  Verify the final workspace/output state.

prompt: |
  Prepare the external-monitor workflow for {{ output_request }}.
  Inspect the current Sway state, make only the requested workspace/output changes,
  and report the final state.
parameters:
  - key: output_request
    input_type: string
    requirement: required
    description: "Describe the external monitor and workspace arrangement."
extensions:
  - type: builtin
    name: developer
    description: "Provides shell capabilities for AutoSway."
